name: TV shot svakih 15 min

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  shot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Kesiraj browser (manja potrosnja besplatnih minuta)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium
      - name: Instaliraj browser
        run: |
          pip install -r requirements_cloud.txt
          python -m playwright install --with-deps chromium
      - name: Slikaj i posalji
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TV_SESSIONID: ${{ secrets.TV_SESSIONID }}
          TV_SESSIONID_SIGN: ${{ secrets.TV_SESSIONID_SIGN }}
          LAYOUT_URL: ${{ secrets.LAYOUT_URL }}
        run: python cloud_tv_shot.py
      - name: Sacuvaj sliku kao artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv-shot
          path: tv_cloud_*.png
          if-no-files-found: warn
